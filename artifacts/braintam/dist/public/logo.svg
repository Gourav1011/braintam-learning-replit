<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="40" fill="#0B2B6B"/>
  <!-- Mobile phone -->
  <rect x="112" y="58" width="50" height="84" rx="8" fill="#FF6B1A"/>
  <rect x="116" y="68" width="42" height="58" rx="4" fill="#0B2B6B"/>
  <circle cx="137" cy="134" r="4" fill="white" opacity="0.7"/>
  <!-- Book -->
  <rect x="38" y="72" width="68" height="68" rx="6" fill="white" opacity="0.15"/>
  <rect x="38" y="72" width="68" height="68" rx="6" fill="none" stroke="white" stroke-width="3" opacity="0.4"/>
  <!-- Book spine -->
  <line x1="72" y1="72" x2="72" y2="140" stroke="white" stroke-width="3" opacity="0.5"/>
  <!-- Book pages left -->
  <line x1="45" y1="90" x2="68" y2="90" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="45" y1="100" x2="68" y2="100" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="45" y1="110" x2="68" y2="110" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="45" y1="120" x2="68" y2="120" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Book pages right -->
  <line x1="76" y1="90" x2="99" y2="90" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="76" y1="100" x2="99" y2="100" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="76" y1="110" x2="99" y2="110" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="76" y1="120" x2="99" y2="120" stroke="white" stroke-width="2" opacity="0.6"/>
</svg>
